<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Looook — Gaze Path Tracking Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    p {
      margin: 0 0 30px;
      color: #999;
    }

    #game-area {
      position: relative;
      width: min(1000px, 90vw);
      height: 560px;

      border: 1px solid #333;
      border-radius: 20px;

      background: #181818;

      overflow: hidden;
    }

    #path-svg {
      width: 100%;
      height: 100%;
    }

    #route-background {
      fill: none;
      stroke: #3a3a3a;
      stroke-width: 70;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #route-center {
      fill: none;
      stroke: #777;
      stroke-width: 4;
      stroke-dasharray: 10 12;
      stroke-linecap: round;
    }

    .marker {
      position: absolute;

      width: 70px;
      height: 70px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: bold;
      font-size: 13px;

      transform: translate(-50%, -50%);
    }

    #start-marker {
      left: 10%;
      top: 75%;

      background: #00e891;
      color: #111;
    }

    #end-marker {
      left: 88%;
      top: 28%;

      background: #ffcf4d;
      color: #111;
    }

    #moving-dot {
      position: absolute;

      width: 26px;
      height: 26px;

      border-radius: 50%;

      background: #ff5d5d;

      transform: translate(-50%, -50%);

      pointer-events: none;

      z-index: 10;

      box-shadow:
        0 0 0 8px rgba(255, 93, 93, 0.15);
    }
  </style>
</head>


<body>

  <h1>
    Gaze Path Tracking Test
  </h1>

  <p>
    Follow the moving dot from START to END.
  </p>


  <div id="game-area">

    <svg
      id="path-svg"
      viewBox="0 0 1000 560"
      preserveAspectRatio="none"
    >

      <path
        id="route-background"
        d="
          M 100 420
          C 220 300, 270 470, 390 350
          S 560 190, 660 310
          S 790 410, 880 160
        "
      >
      </path>

      <path
        id="route-center"
        d="
          M 100 420
          C 220 300, 270 470, 390 350
          S 560 190, 660 310
          S 790 410, 880 160
        "
      >
      </path>

    </svg>


    <div
      class="marker"
      id="start-marker"
    >
      START
    </div>


    <div
      class="marker"
      id="end-marker"
    >
      END
    </div>


    <div
      id="moving-dot"
    >
    </div>

  </div>


  <script>

    const path =
      document.getElementById("route-center");

    const movingDot =
      document.getElementById("moving-dot");

    const svg =
      document.getElementById("path-svg");


    const totalLength =
      path.getTotalLength();


    let progress = 0;


    function animateDot() {

      progress += 0.0015;


      if (progress > 1) {

        progress = 0;

      }


      const point =
        path.getPointAtLength(
          totalLength * progress
        );


      const svgRect =
        svg.getBoundingClientRect();


      const scaleX =
        svgRect.width / 1000;

      const scaleY =
        svgRect.height / 560;


      movingDot.style.left =
        point.x * scaleX + "px";

      movingDot.style.top =
        point.y * scaleY + "px";


      requestAnimationFrame(
        animateDot
      );

    }


    animateDot();

  </script>

</body>

</html>
