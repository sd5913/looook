
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>LOOOOK V0.2 — Eye Tracking</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    video {
      width: 100%;
      max-width: 640px;
      border-radius: 16px;
      transform: scaleX(-1);
      background: #222;
    }

    button {
      padding: 14px 28px;
      border: 0;
      border-radius: 12px;
      background: #00d99a;
      font-size: 17px;
      cursor: pointer;
    }

    #status {
      margin: 20px;
    }

    #debug {
      margin: 20px auto;
      max-width: 500px;
      text-align: left;
      white-space: pre-wrap;
      line-height: 1.8;
      background: #222;
      padding: 20px;
      border-radius: 12px;
    }

#gazeTarget {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  width: 24px;
  height: 24px;
  border-radius: 50%;

  background: #00d99a;
  border: 4px solid white;
  box-shadow: 0 0 20px rgba(0, 217, 154, 0.6);

  z-index: 1000;
  pointer-events: none;
}

#gazeTarget[hidden] {
  display: none;
}

  </style>
</head>

<body>
  <h1>LOOOOK V0.2</h1>
  <p>Eye Feature Detection</p>

  <button id="startButton">
    Start Camera
  </button>

  <p id="status">Camera not started</p>

<div id="samplingControls">
  <button id="sampleTop" type="button" disabled>
    Sample TOP
  </button>

  <button id="sampleCenter" type="button" disabled>
    Sample CENTER
  </button>

  <button id="sampleBottom" type="button" disabled>
    Sample BOTTOM
  </button>
</div>

<p id="samplingStatus">Sampling not started</p>

<div id="gazeTarget" hidden aria-hidden="true"></div>

  <video id="webcam" autoplay muted playsinline></video>

  <pre id="debug">Waiting for eye data...</pre>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/+esm";

    const video = document.getElementById("webcam");
    const status = document.getElementById("status");
    const debug = document.getElementById("debug");
    const button = document.getElementById("startButton");

const sampleTopButton =
  document.getElementById("sampleTop");

const sampleCenterButton =
  document.getElementById("sampleCenter");

const sampleBottomButton =
  document.getElementById("sampleBottom");

const samplingStatus =
  document.getElementById("samplingStatus");

const gazeTarget =
  document.getElementById("gazeTarget");

    let faceLandmarker;
    let lastVideoTime = -1;

let samplingTarget = null;
let samplingStartTime = 0;
let samplingFrames = [];

const SAMPLE_DURATION_MS = 2000;

const PREPARE_DURATION_MS = 2000;

let audioContext = null;
let samplingStarted = false;

function playBeep(frequency, count = 1) {
  if (!audioContext) {
    audioContext = new AudioContext();
  }

  audioContext.resume();

  for (let i = 0; i < count; i++) {
    const startTime =
      audioContext.currentTime + i * 0.22;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.frequency.value = frequency;
    oscillator.type = "sine";

    gain.gain.setValueAtTime(0.08, startTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      startTime + 0.12
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(startTime);
    oscillator.stop(startTime + 0.12);
  }
}

    button.addEventListener("click", startCamera);

sampleTopButton.addEventListener("click", () => {
  startSampling("TOP");
});

sampleCenterButton.addEventListener("click", () => {
  startSampling("CENTER");
});

sampleBottomButton.addEventListener("click", () => {
  startSampling("BOTTOM");
});


function startSampling(target) {
  samplingTarget = target;

  samplingStartTime =
    performance.now() + PREPARE_DURATION_MS;

  samplingFrames = [];


const targetPositions = {
  TOP: "15%",
  CENTER: "50%",
  BOTTOM: "85%"
};

gazeTarget.style.top = targetPositions[target];
gazeTarget.style.left = "50%";
gazeTarget.hidden = false;


sampleTopButton.disabled = true;
sampleCenterButton.disabled = true;
sampleBottomButton.disabled = true;

samplingStarted = false;
playBeep(550, 1);
  samplingStatus.textContent =
    "Preparing " + target + " — look at the target";
}


    async function startCamera() {
      button.disabled = true;
      status.textContent = "Loading MediaPipe...";

      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm"
        );

        faceLandmarker = await FaceLandmarker.createFromOptions(
          vision,
          {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
              delegate: "CPU"
            },
            runningMode: "VIDEO",
            numFaces: 1
          }
        );

        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;
        await video.play();

       status.textContent = "Camera ready";

sampleTopButton.disabled = false;
sampleCenterButton.disabled = false;
sampleBottomButton.disabled = false;

samplingStatus.textContent = "Ready to sample";

requestAnimationFrame(trackEyes);

      } catch (error) {
        console.error(error);
        status.textContent = "Error: " + error.message;
        button.disabled = false;
      }
    }

    function trackEyes() {
      if (
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
      ) {
        lastVideoTime = video.currentTime;

        const result = faceLandmarker.detectForVideo(
          video,
          performance.now()
        );

        const landmarks = result.faceLandmarks[0];

        if (landmarks && landmarks.length > 473) {
          const leftIris = landmarks[468];
          const rightIris = landmarks[473];

const leftEyeMinX = Math.min(
  landmarks[33].x,
  landmarks[133].x
);

const leftEyeMaxX = Math.max(
  landmarks[33].x,
  landmarks[133].x
);

const rightEyeMinX = Math.min(
  landmarks[362].x,
  landmarks[263].x
);

const rightEyeMaxX = Math.max(
  landmarks[362].x,
  landmarks[263].x
);

const leftRelativeX =
  (leftIris.x - leftEyeMinX) /
  Math.max(leftEyeMaxX - leftEyeMinX, 0.0001);

const rightRelativeX =
  (rightIris.x - rightEyeMinX) /
  Math.max(rightEyeMaxX - rightEyeMinX, 0.0001);

          status.textContent = "Eyes detected";

const leftTopY = landmarks[159].y;
const leftBottomY = landmarks[145].y;

const rightTopY = landmarks[386].y;
const rightBottomY = landmarks[374].y;

const leftEyeHeight = Math.abs(leftBottomY - leftTopY);
const rightEyeHeight = Math.abs(rightBottomY - rightTopY);

const leftRelativeY =
  leftEyeHeight > 0.005
    ? (leftIris.y - Math.min(leftTopY, leftBottomY)) / leftEyeHeight
    : null;

const rightRelativeY =
  rightEyeHeight > 0.005
    ? (rightIris.y - Math.min(rightTopY, rightBottomY)) / rightEyeHeight
    : null;

const leftEyeCornerY =
  (landmarks[33].y + landmarks[133].y) / 2;

const rightEyeCornerY =
  (landmarks[362].y + landmarks[263].y) / 2;

const leftEyeWidth = Math.hypot(
  landmarks[33].x - landmarks[133].x,
  landmarks[33].y - landmarks[133].y
);

const rightEyeWidth = Math.hypot(
  landmarks[362].x - landmarks[263].x,
  landmarks[362].y - landmarks[263].y
);

const leftCornerRelativeY =
  (leftIris.y - leftEyeCornerY) /
  Math.max(leftEyeWidth, 0.0001);

const rightCornerRelativeY =
  (rightIris.y - rightEyeCornerY) /
  Math.max(rightEyeWidth, 0.0001);

      
if (samplingTarget !== null) {
  const elapsed = performance.now() - samplingStartTime;

  
if (elapsed < 0) {
  const secondsLeft = Math.ceil(-elapsed / 1000);

  samplingStatus.textContent =
    "Preparing " + samplingTarget +
    ": " + secondsLeft + "s";

} else if (elapsed < SAMPLE_DURATION_MS) {
if (!samplingStarted) {
  samplingStarted = true;
  playBeep(1000, 2);
}
    if (
      leftRelativeY !== null &&
      rightRelativeY !== null
    ) {
      samplingFrames.push({
        leftRelativeX,
        rightRelativeX,
        leftRelativeY,
        rightRelativeY,
        leftCornerRelativeY,
        rightCornerRelativeY
      });
    }

    samplingStatus.textContent =
      "Sampling " + samplingTarget +
      ": " + samplingFrames.length + " valid frames";

  
} else {
  playBeep(700, 3);

  const count = samplingFrames.length;

  if (count === 0) {
    samplingStatus.textContent =
      "Finished " + samplingTarget + ": no valid frames";
  } else {
    const leftMean =
      samplingFrames.reduce(
        (sum, frame) => sum + frame.leftCornerRelativeY,
        0
      ) / count;

    const rightMean =
      samplingFrames.reduce(
        (sum, frame) => sum + frame.rightCornerRelativeY,
        0
      ) / count;

const leftStd = Math.sqrt(
  samplingFrames.reduce(
    (sum, frame) =>
      sum + Math.pow(frame.leftCornerRelativeY - leftMean, 2),
    0
  ) / count
);

const rightStd = Math.sqrt(
  samplingFrames.reduce(
    (sum, frame) =>
      sum + Math.pow(frame.rightCornerRelativeY - rightMean, 2),
    0
  ) / count
);

    
samplingStatus.textContent =
  "Finished " + samplingTarget +
  ": " + count + " valid frames" +
  " | Left Corner Y mean: " + leftMean.toFixed(4) +
  " | Right Corner Y mean: " + rightMean.toFixed(4) +
  " | Left Corner Y std: " + leftStd.toFixed(4) +
  " | Right Corner Y std: " + rightStd.toFixed(4);

  }

  samplingTarget = null;

gazeTarget.hidden = true;


sampleTopButton.disabled = false;
sampleCenterButton.disabled = false;
sampleBottomButton.disabled = false;

}

}
    
debug.textContent =
  "Landmarks: " + landmarks.length + "\n" +
  "\n" +
  "--- Original Iris Position ---\n" +
  "Left Iris X: " + leftIris.x.toFixed(4) + "\n" +
  "Left Iris Y: " + leftIris.y.toFixed(4) + "\n" +
  "Right Iris X: " + rightIris.x.toFixed(4) + "\n" +
  "Right Iris Y: " + rightIris.y.toFixed(4) + "\n" +
  "\n" +
  "--- Relative Eye Position ---\n" +
 
"Left Relative X: " + leftRelativeX.toFixed(4) + "\n" +
"Right Relative X: " + rightRelativeX.toFixed(4) + "\n" +
"Left Relative Y: " +
  (leftRelativeY === null ? "INVALID" : leftRelativeY.toFixed(4)) + "\n" +

"Right Relative Y: " +
  (rightRelativeY === null ? "INVALID" : rightRelativeY.toFixed(4)) + "\n" +
"\n" +
"--- Eye Corner Relative Y ---\n" +
"Left Corner Relative Y: " + leftCornerRelativeY.toFixed(4) + "\n" +
"Right Corner Relative Y: " + rightCornerRelativeY.toFixed(4);


        } else {
          status.textContent = "Searching for eyes...";
          debug.textContent = "No valid eye landmarks";
        }
      }

      requestAnimationFrame(trackEyes);
    }
  </script>
</body>
</html>
