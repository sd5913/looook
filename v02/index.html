
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>LOOOOK V0.2 — Eye Tracking</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    video {
      width: 100%;
      max-width: 640px;
      border-radius: 16px;
      transform: scaleX(-1);
      background: #222;
    }

    button {
      padding: 14px 28px;
      border: 0;
      border-radius: 12px;
      background: #00d99a;
      font-size: 17px;
      cursor: pointer;
    }

    #status {
      margin: 20px;
    }

    #debug {
      margin: 20px auto;
      max-width: 500px;
      text-align: left;
      white-space: pre-wrap;
      line-height: 1.8;
      background: #222;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <h1>LOOOOK V0.2</h1>
  <p>Eye Feature Detection</p>

  <button id="startButton">
    Start Camera
  </button>

  <p id="status">Camera not started</p>

  <video id="webcam" autoplay muted playsinline></video>

  <pre id="debug">Waiting for eye data...</pre>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/+esm";

    const video = document.getElementById("webcam");
    const status = document.getElementById("status");
    const debug = document.getElementById("debug");
    const button = document.getElementById("startButton");

    let faceLandmarker;
    let lastVideoTime = -1;

    button.addEventListener("click", startCamera);

    async function startCamera() {
      button.disabled = true;
      status.textContent = "Loading MediaPipe...";

      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm"
        );

        faceLandmarker = await FaceLandmarker.createFromOptions(
          vision,
          {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
              delegate: "CPU"
            },
            runningMode: "VIDEO",
            numFaces: 1
          }
        );

        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        status.textContent = "Camera ready";
        requestAnimationFrame(trackEyes);

      } catch (error) {
        console.error(error);
        status.textContent = "Error: " + error.message;
        button.disabled = false;
      }
    }

    function trackEyes() {
      if (
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
      ) {
        lastVideoTime = video.currentTime;

        const result = faceLandmarker.detectForVideo(
          video,
          performance.now()
        );

        const landmarks = result.faceLandmarks[0];

        if (landmarks && landmarks.length > 473) {
          const leftIris = landmarks[468];
          const rightIris = landmarks[473];

const leftEyeMinX = Math.min(
  landmarks[33].x,
  landmarks[133].x
);

const leftEyeMaxX = Math.max(
  landmarks[33].x,
  landmarks[133].x
);

const rightEyeMinX = Math.min(
  landmarks[362].x,
  landmarks[263].x
);

const rightEyeMaxX = Math.max(
  landmarks[362].x,
  landmarks[263].x
);

const leftRelativeX =
  (leftIris.x - leftEyeMinX) /
  Math.max(leftEyeMaxX - leftEyeMinX, 0.0001);

const rightRelativeX =
  (rightIris.x - rightEyeMinX) /
  Math.max(rightEyeMaxX - rightEyeMinX, 0.0001);

          status.textContent = "Eyes detected";

          
debug.textContent =
  "Landmarks: " + landmarks.length + "\n" +
  "\n" +
  "--- Original Iris Position ---\n" +
  "Left Iris X: " + leftIris.x.toFixed(4) + "\n" +
  "Left Iris Y: " + leftIris.y.toFixed(4) + "\n" +
  "Right Iris X: " + rightIris.x.toFixed(4) + "\n" +
  "Right Iris Y: " + rightIris.y.toFixed(4) + "\n" +
  "\n" +
  "--- Relative Eye Position ---\n" +
  "Left Relative X: " + leftRelativeX.toFixed(4) + "\n" +
  "Right Relative X: " + rightRelativeX.toFixed(4);


        } else {
          status.textContent = "Searching for eyes...";
          debug.textContent = "No valid eye landmarks";
        }
      }

      requestAnimationFrame(trackEyes);
    }
  </script>
</body>
</html>
